name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared types into server vendor
        run: node apps/server/scripts/sync-shared.js
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service codraft-server
        working-directory: apps/server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
