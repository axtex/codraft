name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - 'package.json'
      - 'railway.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        # Deploy from monorepo root so @codraft/shared is in the build context
        # (Root Directory on the Railway service must be empty / "/").
        run: railway up --service codraft-server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
