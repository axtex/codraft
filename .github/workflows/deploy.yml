name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared types into server vendor
        run: node apps/server/scripts/sync-shared.js
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        # Upload the repo root. The Railway service root is apps/server, so
        # uploading from apps/server makes Nixpacks look for a nested
        # apps/server that is not in the archive.
        # RAILWAY_TOKEN must be a project token. Do not also set RAILWAY_PROJECT_ID.
        run: railway up --ci --service codraft
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
